<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>INCT Wetscape - Plataforma Geoespacial</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/L.Control.Locate.min.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet-search.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">

        <style>
        :root {
            --brand-green: #024B30;
            --brand-green-light: #0d6e49;
            --brand-accent: #FFCD61;
            --bg-glass: rgba(255, 255, 255, 0.88);
            --border-soft: rgba(0, 0, 0, 0.08);
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --shadow-control: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
            background: #111;
        }

        /* Top Navbar */
        #top-navbar {
            position: absolute;
            top: 14px;
            left: 60px;
            z-index: 1000;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 18px;
            border-radius: 12px;
            box-shadow: var(--shadow-control);
            border: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #top-navbar .tag {
            background: var(--brand-green);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 6px;
        }

        #top-navbar h1 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Leaflet Controls Reskin */
        .leaflet-bar {
            border: none !important;
            box-shadow: var(--shadow-control) !important;
            border-radius: 10px !important;
            overflow: hidden;
            background: var(--bg-glass) !important;
            backdrop-filter: blur(8px);
        }

        .leaflet-bar a {
            background-color: transparent !important;
            border-bottom: 1px solid var(--border-soft) !important;
            color: #334155 !important;
            transition: background-color 0.2s;
        }

        .leaflet-bar a:hover {
            background-color: #f1f5f9 !important;
            color: var(--brand-green) !important;
        }

        .leaflet-top.leaflet-left {
            top: 70px;
        }

        /* Estilização da Árvore de Camadas */
        .leaflet-control-layers {
            border: 1px solid var(--border-soft) !important;
            border-radius: 14px !important;
            box-shadow: var(--shadow-card) !important;
            background: var(--bg-glass) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 14px !important;
            max-width: 320px;
        }

        .leaflet-control-layers-expanded {
            color: #1e293b;
        }

        .leaflet-control-layers-list {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        .leaflet-control-layers-list::-webkit-scrollbar {
            width: 5px;
        }

        .leaflet-control-layers-list::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }

        .leaflet-control-layers table {
            border-spacing: 0 4px;
            font-size: 12px;
            margin-top: 4px;
        }

        .leaflet-control-layers td {
            vertical-align: middle;
            padding: 2px 4px;
        }

        /* Redesenho do Pop-up */
        .leaflet-popup-content-wrapper {
            background: var(--bg-glass) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 14px !important;
            box-shadow: var(--shadow-card) !important;
            border: 1px solid var(--border-soft);
            padding: 6px;
        }

        .leaflet-popup-content {
            margin: 10px 14px !important;
            line-height: 1.4;
            color: #334155;
        }

        .custom-popup-card {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .custom-popup-badge {
            font-size: 10px;
            font-weight: 700;
            color: var(--brand-green);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .custom-popup-title {
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 2px;
        }

        .leaflet-container a.leaflet-popup-close-button {
            top: 10px;
            right: 10px;
            padding: 4px;
            color: #64748b;
        }
        </style>
    </head>
    <body>
        <div id="top-navbar">
            <span class="tag">INCT Wetscape</span>
            <h1>Rede de Pesquisa & Unidades</h1>
        </div>

        <div id="map"></div>

        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/L.Control.Locate.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="js/leaflet-search.js"></script>
        <script src="data/readeestudoPUEP_2.js"></script>
        <script src="data/Instituies_3.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;
            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({ color: '#FFCD61', weight: 4 });
            } else {
              highlightLayer.setStyle({ fillColor: '#FFCD61', fillOpacity: 0.85 });
            }
        }

        var map = L.map('map', {
            zoomControl: false, maxZoom: 28, minZoom: 1
        }).fitBounds([[-37.59788788362722,-86.18668636122842],[7.489851392374007,-6.1758240943698155]]);
        
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com">Leaflet</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        var zoomControl = L.control.zoom({ position: 'topleft' }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters', secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters', secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';

        var bounds_group = new L.featureGroup([]);
        function setBounds() {}

        map.createPane('pane_GoogleSatellite_0');
        map.getPane('pane_GoogleSatellite_0').style.zIndex = 400;
        var layer_GoogleSatellite_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatellite_0', opacity: 1.0,
            attribution: 'Map data © Google',
            minZoom: 1, maxZoom: 28
        });
        map.addLayer(layer_GoogleSatellite_0);

        map.createPane('pane_GoogleLabels_1');
        map.getPane('pane_GoogleLabels_1').style.zIndex = 401;
        var layer_GoogleLabels_1 = L.tileLayer('https://mt1.google.com/vt/lyrs=h&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleLabels_1', opacity: 1.0,
            attribution: 'Map data © Google',
            minZoom: 1, maxZoom: 28
        });
        map.addLayer(layer_GoogleLabels_1);

        function pop_readeestudoPUEP_2(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var fid = feature.properties['fid'] !== null ? feature.properties['fid'] : '-';
            var popupContent = '<div class="custom-popup-card"><span class="custom-popup-badge">Área de Estudo</span><div class="custom-popup-title">PUEP (FID: ' + fid + ')</div></div>';
            layer.bindPopup(popupContent, { maxHeight: 400 });
        }

        function style_readeestudoPUEP_2_0() {
            return {
                pane: 'pane_readeestudoPUEP_2', opacity: 1, color: '#024B30',
                dashArray: '', lineCap: 'round', lineJoin: 'round', weight: 2.5, fillOpacity: 0.05, fillColor: '#024B30', interactive: true
            };
        }
        map.createPane('pane_readeestudoPUEP_2');
        map.getPane('pane_readeestudoPUEP_2').style.zIndex = 402;
        var layer_readeestudoPUEP_2 = new L.geoJson(json_readeestudoPUEP_2, {
            pane: 'pane_readeestudoPUEP_2', onEachFeature: pop_readeestudoPUEP_2, style: style_readeestudoPUEP_2_0
        });
        bounds_group.addLayer(layer_readeestudoPUEP_2);
        map.addLayer(layer_readeestudoPUEP_2);

        function pop_Instituies_3(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var nome = feature.properties['Name'] !== null ? autolinker.link(String(feature.properties['Name'])) : 'Instituição';
            var popupContent = '<div class="custom-popup-card"><span class="custom-popup-badge">Instituição Membro</span><div class="custom-popup-title">' + nome + '</div></div>';
            layer.bindPopup(popupContent, { maxHeight: 400 });
        }

        function style_Instituies_3_0(feature) {
            switch(String(feature.properties['Name'])) {
                case 'CEM - UFPR':
                    return { pane: 'pane_Instituies_3', rotationAngle: 0.0, rotationOrigin: 'center center', icon: L.icon({ iconUrl: 'markers/Instituies_3.svg', iconSize: [25.08, 25.08] }), interactive: true };
                case 'Universidade Federal do Paraná (UFPR) - DeArtes':
                case 'Universidade de Brasília (UnB)':
                case 'Universidade de Cuiabá':
                case 'Universidade de Leeds, Reino Unido':
                case 'Universidade de São Paulo (USP)':
                case 'Universidade do Estado de Mato Grosso (UNEMAT)':
                case 'Universidade Federal de Mato Grosso (UFMT)':
                case 'Universidade Federal de Mato Grosso do Sul (UFMS)':
                case 'Universidade Federal do Amazonas (UFAM)':
                case 'Universidade Federal do Rio de Janeiro (UFRJ)':
                case 'Universidade Federal do Rio Grande (FURG)':
                    return { pane: 'pane_Instituies_3', rotationAngle: 0.0, rotationOrigin: 'center center', icon: L.icon({ iconUrl: 'markers/Instituies_3.svg', iconSize: [18, 18] }), interactive: true };
                default:
                    return { pane: 'pane_Instituies_3', radius: 5.0, opacity: 1, color: '#ffffff', weight: 1.5, fill: true, fillOpacity: 0.9, fillColor: '#024B30', interactive: true };
            }
        }
        
        map.createPane('pane_Instituies_3');
        map.getPane('pane_Instituies_3').style.zIndex = 403;
        var layer_Instituies_3 = new L.geoJson(json_Instituies_3, {
            pane: 'pane_Instituies_3', onEachFeature: pop_Instituies_3,
            pointToLayer: function (feature, latlng) { return L.circleMarker(latlng, style_Instituies_3_0(feature)); }
        });
        bounds_group.addLayer(layer_Instituies_3);
        map.addLayer(layer_Instituies_3);

        const url = {"Nominatim OSM": "https://nominatim.openstreetmap.org/search?format=geojson&addressdetails=1&"};
        var photonControl = L.control.photon({ url: url["Nominatim OSM"], feedbackLabel: '', position: 'topleft', includePosition: true, initial: true }).addTo(map);
        if (photonControl._container && photonControl._container.childNodes[0]) {
            photonControl._container.childNodes[0].style.borderRadius = "10px";
        }

        fetch('LML_LimitesPeaLei2006_PUAraguaia.geojson')
            .then(response => {
                if (!response.ok) throw new Error("Vetor do Araguaia não localizado.");
                return response.json();
            })
            .then(data => {
                map.createPane('pane_limite_araguaia');
                map.getPane('pane_limite_araguaia').style.zIndex = 404;

                var camadaAraguaia = L.geoJSON(data, {
                    pane: 'pane_limite_araguaia',
                    style: function () {
                        return { color: '#024B30', weight: 2.5, opacity: 0.9, fillColor: '#FFCD61', fillOpacity: 0.15 };
                    }
                }).addTo(map);

                camadaAraguaia.bindPopup('<div class="custom-popup-card"><span class="custom-popup-badge">Território</span><div class="custom-popup-title">PU Araguaia</div><div style="font-size:12px;color:#64748b;">Limites Pea Lei 2006</div></div>');

                var overlaysTree = [
                    {label: '<b>Instituições Participantes</b>', layer: layer_Instituies_3},
                    {label: '<b>PU Araguaia</b>', selectAllCheckbox: true, children: [
                        {label: '<span style="display:inline-block; width:12px; height:12px; border:2px solid #024B30; background:rgba(255,205,97,0.3); border-radius:3px;"></span> Limites Pea Lei 2006', layer: camadaAraguaia}
                    ]},
                    {label: '<b>PUEP</b>', selectAllCheckbox: true, children: [
                        {label: '<span style="display:inline-block; width:12px; height:12px; border:2px solid #024B30; background:rgba(2,75,48,0.1); border-radius:3px;"></span> Área de estudo', layer: layer_readeestudoPUEP_2}
                    ]},
                    {label: "Google Satélite", layer: layer_GoogleSatellite_0},
                    {label: "Google Rótulos", layer: layer_GoogleLabels_1}
                ];

                var lay = L.control.layers.tree(null, overlaysTree, { collapsed: false });
                lay.addTo(map);
            })
            .catch(error => console.warn("Erro ao carregar limite do Araguaia:", error));

        setBounds();
        map.addControl(new L.Control.Search({ layer: layer_Instituies_3, initial: false, hideMarkerOnCollapse: true, propertyName: 'Name'}));
        
        resetLabels([layer_Instituies_3]);
        map.on("zoomend", function(){ resetLabels([layer_Instituies_3]); });
        map.on("layeradd", function(){ resetLabels([layer_Instituies_3]); });
        map.on("layerremove", function(){ resetLabels([layer_Instituies_3]); });
        </script>        
    </body>
</html>
